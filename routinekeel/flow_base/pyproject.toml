[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "flow_base"
version = "0.2.13"
description = "Shared workspace runtime for independently packaged workflows"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic==2.14.3", "pydantic-core==2.50.4", "filelock==3.32.7",
  "annotated-types==0.8.0", "typing-extensions==4.16.0", "typing-inspection==0.4.5"
]
readme = "README.md"
license = "MIT"

[project.scripts]
flow_base = "flow_base.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp==2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flow_base"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/tools", "/docs", "/examples", "/.github", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[dependency-groups]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

