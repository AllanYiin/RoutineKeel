<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoutineKeel 流程製作</title>
<style>
:root{--bg:#F8FAFC;--panel:#FFFFFF;--text:#0F172A;--muted:#475569;--primary:#2563EB;--ok:#15803D;--wait:#B45309;--bad:#B91C1C;--line:#CBD5E1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Microsoft JhengHei UI","PingFang TC","Noto Sans TC",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:28px 0 10px}
.muted{color:var(--muted);font-size:14px}
.banner{border:1px solid var(--line);border-left:5px solid var(--primary);background:var(--panel);padding:12px 14px;margin:16px 0;border-radius:6px}
.banner.wait{border-left-color:var(--wait)}.banner.ok{border-left-color:var(--ok)}.banner.bad{border-left-color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:10px 0}
.tag{display:inline-block;font-size:13px;padding:1px 8px;border-radius:10px;border:1px solid currentColor;margin-right:8px}
.tag.ok{color:var(--ok)}.tag.wait{color:var(--wait)}.tag.ask{color:var(--primary)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
button{font:inherit;padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
textarea,input[type=text]{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
textarea{min-height:90px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13px;max-height:200px;overflow:auto;margin:6px 0}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.option{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);text-align:left;width:100%}
.option ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
#error{color:var(--bad);margin:8px 0;min-height:1.6em}
details summary{cursor:pointer;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1 id="title">RoutineKeel 流程製作</h1>
<div class="muted">這一頁只有你能操作。AI 在對話裡整理流程，需要你確認的事會出現在這裡。</div>
<div id="banner" class="banner" role="status">載入中…</div>
<div id="error" role="alert"></div>

<h2>1　提供工作材料</h2>
<div class="card">
  <label for="text">用自己的話描述工作，或貼上既有的說明</label>
  <textarea id="text" placeholder="每個月把報名表整理成各班名單，重複報名的留最後一筆"></textarea>
  <div class="row">
    <button id="addText">加入這段說明</button>
    <label><input type="file" id="folder" webkitdirectory multiple hidden><span id="pick" role="button" tabindex="0" style="border:1px solid var(--line);border-radius:6px;padding:6px 14px;cursor:pointer">選擇成功案例資料夾</span></label>
  </div>
</div>
<div id="sources"></div>

<h2>2　確認 AI 整理的內容</h2>
<div id="cards"><div class="muted">AI 提出流程草稿後，確認事項會出現在這裡。</div></div>

<div id="caseBox" hidden>
  <h2>4　試做案例</h2>
  <div class="muted">指定一份輸入和它的正確成果。AI 做出的流程必須重現這份成果，才算通過。</div>
  <div id="cases"></div>
</div>

<div id="trialBox" hidden>
  <h2>5　試做結果</h2>
  <div id="trial"></div>
</div>

<div id="publishBox" hidden>
  <h2>6　核准並發布</h2>
  <div class="card">
    <div class="muted" id="target"></div>
    <label for="approver">核准者姓名</label>
    <input type="text" id="approver" autocomplete="name">
    <label><input type="checkbox" id="checked"> 我已核對試做成果符合工作目標</label>
    <div class="row"><button class="primary" id="publish">核准並發布到這台電腦</button></div>
  </div>
</div>

<div id="commitBox" hidden>
  <h2>3　存成流程版本</h2>
  <div class="card">
    <label for="actor">確認者姓名</label>
    <input type="text" id="actor" autocomplete="name">
    <div class="row"><button class="primary" id="commit">全部確認，存成版本</button></div>
    <div class="muted">存檔後還要試做並通過比對，才能發布成可重複使用的流程。</div>
  </div>
</div>
</main>
<script>
"use strict";
let csrf = "", view = null, busy = false;
const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
};
async function api(path, body) {
  const options = body === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json", "X-RK-CSRF": csrf}, body: JSON.stringify(body)};
  const response = await fetch(path, options);
  const data = await response.json();
  if (!data.ok) throw new Error(data.error.message);
  return data.result;
}
async function act(action, body) {
  if (busy) return;
  busy = true; $("error").textContent = "";
  try { view = await api("/api/" + action, body); render(); }
  catch (error) { $("error").textContent = error.message; await refresh(); }
  finally { busy = false; }
}
async function refresh() {
  try {
    const result = await api("/api/view"); csrf = result.csrf;
    // Polling must not collapse previews or half-typed corrections when nothing changed.
    const unchanged = JSON.stringify(result.view) === JSON.stringify(view);
    view = result.view; if (!unchanged) render();
  }
  catch (error) { $("banner").className = "banner bad"; $("banner").textContent = "✕ " + error.message; }
}
function banner() {
  const pending = view.cards.filter(c => c.state === "pending").length;
  const messages = {
    empty: ["wait", view.sources.length ? "… 輪到 AI：請回到對話，請它開始整理流程。" : "● 輪到你：先在下方提供工作材料。"],
    needs_reflection: ["wait", `… AI 正在檢查自己的草稿（第 ${view.round} 輪），還不需要你操作。`],
    revising: ["wait", "… AI 正在依你的回答調整流程。請回到對話讓它繼續。"],
    blocked: ["bad", "✕ AI 檢查兩輪後仍有無法解決的問題。請補充材料，再按「重新開始整理」。"],
    cards: pending ? ["", `● 輪到你：共 ${view.cards.length} 項，還有 ${pending} 項需要你回答。`] : ["ok", "✓ 都確認了。填上姓名即可存成版本。"],
    committed: view.cases.length ? ["wait", "… 輪到 AI：請回到對話，請它進行試做。"] : ["", "● 輪到你：在下方指定一組試做案例。"],
    trial_failed: view.repairs >= 2 ? ["bad", "✕ AI 修了兩輪仍未通過。請看下方差異，補充材料或案例後按「再讓 AI 試一次」。"] : ["wait", "… 試做沒有通過，AI 正在依差異修正。請回到對話讓它繼續。"],
    trial_passed: ["", "● 輪到你：試做通過。核對成果後即可核准發布。"],
    published: ["ok", `✓ 已發布為「${view.release ? view.release.workflow_id : ""}」，可以用 RoutineKeel 底座重複執行。`],
  };
  const [tone, text] = messages[view.stage];
  $("banner").className = "banner " + tone;
  $("banner").textContent = text;
  if (view.stage === "trial_failed" && view.repairs >= 2)
    $("banner").append(el("div", {className: "row"}, el("button", {textContent: "再讓 AI 試一次", onclick: () => act("reopen", {version: view.version})})));
  if (view.stage === "blocked") {
    $("banner").append(el("div", {className: "row"}, el("button", {textContent: "重新開始整理", onclick: () => act("reopen", {version: view.version})})));
    for (const item of view.items) $("banner").append(el("div", {className: "muted", textContent: "・" + item.detail}));
  }
}
function renderSources() {
  const box = $("sources"); box.replaceChildren();
  if (!view.sources.length) return;
  box.append(el("div", {className: "muted", textContent: "勾選的材料會交給對話中的 AI 模型閱讀；沒勾選的 AI 只看得到檔名。"}));
  for (const source of view.sources) {
    const check = el("input", {type: "checkbox", checked: view.consented.includes(source.source_id)});
    check.onchange = () => {
      const ids = new Set(view.consented);
      check.checked ? ids.add(source.source_id) : ids.delete(source.source_id);
      act("consent", {version: view.version, source_ids: [...ids]});
    };
    const card = el("div", {className: "card"}, el("label", {}, check, " 同意交給 AI 閱讀：" + source.name));
    for (const file of source.files) {
      const details = el("details", {}, el("summary", {textContent: `${file.path}（${file.size} bytes）`}));
      details.append(file.preview === null ? el("div", {className: "muted", textContent: "此檔案不是文字，無法預覽。"}) : el("pre", {textContent: file.preview}));
      card.append(details);
    }
    box.append(card);
  }
}
const FACTS = [
  ["cost_micro_usd", v => v ? `每次執行有費用（約 ${(v / 1e6).toFixed(6)} 美元）` : "不花錢"],
  ["same_result_each_run", v => v ? "每次結果相同" : "每次結果可能不同"],
  ["needs_person_each_run", v => v ? "每次都要有人處理" : "不需要人工"],
  ["leaves_machine", v => v ? "資料會離開這台電腦" : "資料留在這台電腦"],
  ["platforms", v => "支援：" + v.join("、")],
];
function renderCard(card) {
  const labels = {auto: ["ok", "✓ 材料中看到"], confirm: ["wait", "? AI 推測"], question: ["ask", "● 需要你決定"], choice: ["ask", "● 選擇做法"]};
  const [tone, label] = card.card_id === "goal" ? ["wait", "? 工作目標"] : labels[card.kind];
  const box = el("div", {className: "card"}, el("span", {className: "tag " + tone, textContent: label}), el("span", {textContent: card.kind === "question" ? card.prompt : card.text}));
  if (card.details) box.append(el("div", {className: "muted", textContent: "完成的樣子：" + card.details.join("；")}));
  if (card.kind === "question") box.append(el("div", {className: "muted", textContent: "AI 無法判斷的原因：" + card.why}));
  if (card.locator) box.append(el("div", {className: "muted", textContent: "依據：" + card.locator}));
  const send = (action, value) => act("answer", {version: view.version, card_id: card.card_id, action, value});
  if (card.state !== "pending") {
    const done = {confirmed: "✓ 已確認", chosen: "✓ 已選擇", modified: "✎ 已要求修改，等 AI 調整", answered: "✓ 已回答，等 AI 套用", auto: ""}[card.state];
    if (done) box.append(el("div", {className: "muted", textContent: done}));
  } else if (card.kind === "confirm") {
    const input = el("input", {type: "text", placeholder: "正確的說法是…", hidden: true});
    const submit = el("button", {textContent: "送出修改", hidden: true, onclick: () => input.value.trim() ? send("modify", input.value) : input.focus()});
    box.append(el("div", {className: "row"},
      el("button", {className: "primary", textContent: "正確", onclick: () => send("confirm")}),
      el("button", {textContent: "不對，我要修改", onclick: () => { input.hidden = submit.hidden = false; input.focus(); }})), input, el("div", {className: "row"}, submit));
  } else if (card.kind === "question") {
    const row = el("div", {className: "options"});
    for (const option of card.options) row.append(el("button", {className: "option", textContent: option, onclick: () => send("choose", option)}));
    box.append(row);
  } else {
    const row = el("div", {className: "options"});
    for (const option of card.options) {
      const list = el("ul");
      for (const [key, describe] of FACTS) list.append(el("li", {textContent: describe(option.facts[key])}));
      row.append(el("button", {className: "option", onclick: () => send("choose", option.key)}, el("strong", {textContent: option.title + (option.key === card.drafted ? "（AI 草稿採用）" : "")}), list));
    }
    box.append(row);
  }
  return box;
}
function render() {
  $("title").textContent = view.project.name;
  banner(); renderSources();
  const box = $("cards");
  if (!view.cards.length) {
    box.replaceChildren(el("div", {className: "muted", textContent: "AI 提出流程草稿後，確認事項會出現在這裡。"}));
  } else {
    const auto = view.cards.filter(c => c.kind === "auto"), rest = view.cards.filter(c => c.kind !== "auto");
    box.replaceChildren(...rest.map(renderCard));
    if (auto.length) {
      const details = el("details", {}, el("summary", {textContent: `AI 直接從材料看到、已自動填入的 ${auto.length} 項`}));
      details.append(...auto.map(renderCard)); box.append(details);
    }
  }
  $("commitBox").hidden = !(view.stage === "cards" && view.next.action === "commit");
  const later = ["committed", "trial_failed", "trial_passed", "published"].includes(view.stage);
  $("caseBox").hidden = !later;
  const cases = $("cases"); cases.replaceChildren();
  for (const item of view.cases) cases.append(el("div", {className: "card"}, el("span", {className: "tag ok", textContent: "✓ 已加入"}), item.name));
  for (const pair of view.case_suggestions) cases.append(el("div", {className: "card"},
    el("span", {className: "tag wait", textContent: "? 建議案例"}), `${pair.input_path} → ${pair.expected_path}`,
    el("div", {className: "row"}, el("button", {className: "primary", textContent: "用這一組", onclick: () => act("add_case", {version: view.version, ...pair})}))));
  if (later && view.stage !== "published") {
    const options = view.sources.flatMap(s => s.files.map(f => ({source_id: s.source_id, path: f.path, label: `${s.name}／${f.path}`})));
    const pick = label => { const select = el("select", {ariaLabel: label}); for (const o of options) select.append(el("option", {value: JSON.stringify(o), textContent: o.label})); return select; };
    const input = pick("輸入檔"), expected = pick("正確成果檔");
    cases.append(el("details", {}, el("summary", {textContent: "自己指定輸入與正確成果"}), el("div", {className: "card"},
      el("div", {}, "輸入 ", input), el("div", {}, "正確成果 ", expected),
      el("div", {className: "row"}, el("button", {textContent: "加入案例", onclick: () => {
        const a = JSON.parse(input.value), b = JSON.parse(expected.value);
        if (a.source_id !== b.source_id) { $("error").textContent = "輸入與正確成果要來自同一份材料。"; return; }
        act("add_case", {version: view.version, source_id: a.source_id, input_path: a.path, expected_path: b.path});
      }})))));
  }
  $("trialBox").hidden = !view.trial;
  const trial = $("trial"); trial.replaceChildren();
  if (view.trial) {
    if (view.trial.message) trial.append(el("div", {className: "muted", textContent: view.trial.message}));
    for (const item of view.trial.cases) {
      const passed = item.status === "passed";
      const card = el("div", {className: "card"}, el("span", {className: "tag " + (passed ? "ok" : "wait"), textContent: passed ? "✓ 成果相同" : "✕ 成果不同"}), item.name);
      if (item.text_diff) card.append(el("pre", {textContent: item.text_diff}));
      trial.append(card);
    }
  }
  $("publishBox").hidden = view.stage !== "trial_passed";
  $("target").textContent = "發布位置：" + view.publish_target;
}
$("addText").onclick = () => { const text = $("text").value; if (text.trim()) act("import", {text}).then(() => { if (!$("error").textContent) $("text").value = ""; }); };
$("pick").onclick = () => $("folder").click();
$("pick").onkeydown = event => { if (event.key === "Enter" || event.key === " ") $("folder").click(); };
$("folder").onchange = async event => {
  const picked = [...event.target.files];
  if (!picked.length) return;
  const name = picked[0].webkitRelativePath.split("/")[0];
  const files = await Promise.all(picked.map(async file => {
    const bytes = new Uint8Array(await file.arrayBuffer());
    let binary = ""; for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return {path: file.webkitRelativePath.split("/").slice(1).join("/"), data: btoa(binary)};
  }));
  event.target.value = "";
  act("import", {folder: {name, files}});
};
$("publish").onclick = () => {
  if (!$("approver").value.trim()) return $("approver").focus();
  if (!$("checked").checked) { $("error").textContent = "請先勾選已核對試做成果。"; return; }
  act("publish", {version: view.version, actor: $("approver").value});
};
$("commit").onclick = () => $("actor").value.trim() ? act("commit", {version: view.version, actor: $("actor").value}) : $("actor").focus();
(async () => {
  const ticket = new URLSearchParams(location.hash.slice(1)).get("ticket");
  if (ticket) {
    history.replaceState(null, "", location.pathname);
    try { await fetch("/api/session", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ticket})}); } catch (error) {}
  }
  await refresh();
  setInterval(() => { if (!busy && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) refresh(); }, 2500);
})();
</script>
</body>
</html>
