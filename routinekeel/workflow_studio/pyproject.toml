[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "workflow-studio"
version = "0.1.0"
description = "Local design-time workflow compiler for RoutineKeel"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
dependencies = [
    "filelock==3.32.7",
    "pillow>=13.0.0",
    "pydantic==2.14.3",
]

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_studio"]

[project.scripts]
workflow-studio = "workflow_studio.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "build>=1.2,<2",
    "ruff>=0.9,<1",
    "flow-base",
]

[tool.pytest.ini_options]
testpaths = ["../../tests/studio"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
flow-base = { path = "../flow_base", editable = true }
