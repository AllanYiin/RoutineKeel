name: Manual cross-platform acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned packaging tool
        run: python -m pip install 'uv==0.13.6'
      - name: Build release ZIPs
        run: python tools/release.py
      - name: Run complete source and package tests with optional MCP
        run: uv run --locked --python 3.12 --project routinekeel/flow_base --extra mcp --group dev pytest tests routinekeel/flows -q --tb=short
