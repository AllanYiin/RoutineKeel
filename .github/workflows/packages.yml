name: Build and release packages

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      publish_release:
        description: '完成使用者走查並核准發布後，勾選以發布 ZIP'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  studio-acceptance:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/studio-acceptance.yml

  build:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the packaging tool
        run: python -m pip install 'uv==0.13.6'
      - name: Build separate ZIPs
        run: python tools/release.py
      - name: Test packages and source
        shell: bash
        run: |
          export FLOW_BASE_TEST_PWSH="$(command -v pwsh)"
          uv run --locked --project routinekeel/flow_base --extra mcp --group dev pytest tests routinekeel/flows --ignore=tests/studio -q
          (cd dist/release && sha256sum -c SHA256SUMS)
      - name: Keep verified release assets
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-packages
          path: dist/release/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  platform-acceptance:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the packaging tool
        run: python -m pip install 'uv==0.13.6'
      - name: Build separate ZIPs
        run: python tools/release.py
      - name: Test packages and source with optional MCP
        run: uv run --locked --python 3.12 --project routinekeel/flow_base --extra mcp --group dev pytest tests routinekeel/flows --ignore=tests/studio -q

  publish:
    needs: [build, platform-acceptance, studio-acceptance]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish_release == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-packages
          path: packages
      - name: Publish verified packages to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-$GITHUB_SHA"
          if result=$(gh release view "$tag" --json isDraft,targetCommitish); then
            jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha' <<< "$result" >/dev/null
            if jq -e '.isDraft == false' <<< "$result" >/dev/null; then
              echo "Release already published for $GITHUB_SHA."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "RoutineKeel ${GITHUB_SHA:0:12}" \
              --notes "每個 ZIP 為獨立套件。將 flow_base 與所需流程解壓到同一個 RoutineKeel 資料夾。SHA256SUMS 可校驗下載檔案。"
          fi
          (cd packages && sha256sum -c SHA256SUMS)
          gh release upload "$tag" packages/*.zip packages/SHA256SUMS packages/versions.json --clobber
          gh release edit "$tag" --draft=false
