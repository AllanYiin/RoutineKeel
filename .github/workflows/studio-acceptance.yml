name: Workflow Studio acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned environment tool
        run: python -m pip install 'uv==0.13.6'
      - name: Prepare independent Runtime environment
        run: uv sync --locked --python 3.12 --project flow_base --group dev
      - name: Prepare Studio development environment
        run: uv sync --locked --python 3.12 --project workflow_studio --group dev
      - name: Record environment and test scope
        env:
          STUDIO_GATE_REPORT_DIR: ${{ runner.temp }}/studio-evidence
        run: uv run --locked --project workflow_studio --group dev python workflow_studio/scripts/ci_environment.py
      - name: Lint and formatting
        run: |
          uv run --locked --project workflow_studio --group dev ruff check --config workflow_studio/pyproject.toml workflow_studio/src workflow_studio/scripts tests/studio
          uv run --locked --project workflow_studio --group dev ruff format --check --config workflow_studio/pyproject.toml workflow_studio/src workflow_studio/scripts tests/studio
      - name: Run complete non-desktop Studio acceptance
        env:
          STUDIO_GATE_REPORT_DIR: ${{ runner.temp }}/studio-evidence
        run: uv run --locked --project workflow_studio --group dev python -m pytest tests/studio -q -rs --junitxml="${{ runner.temp }}/studio-evidence/studio-junit.xml"
      - name: Preserve scoped acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-acceptance-${{ matrix.os }}
          path: ${{ runner.temp }}/studio-evidence/
          if-no-files-found: warn
          retention-days: 7
