name: Workflow Studio acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned environment tool
        run: python -m pip install 'uv==0.13.6'
      - name: Prepare independent Runtime environment
        run: uv sync --locked --python 3.12 --project routinekeel/flow_base --group dev
      - name: Prepare Studio development environment
        run: uv sync --locked --python 3.12 --project routinekeel/workflow_studio --group dev
      - name: Record environment and test scope
        env:
          STUDIO_GATE_REPORT_DIR: ${{ runner.temp }}/studio-evidence
        run: uv run --locked --project routinekeel/workflow_studio --group dev python routinekeel/workflow_studio/scripts/ci_environment.py
      - name: Lint and formatting
        run: |
          uv run --locked --project routinekeel/workflow_studio --group dev ruff check --config routinekeel/workflow_studio/pyproject.toml routinekeel/workflow_studio/src routinekeel/workflow_studio/scripts tests/studio tools/studio_release.py
          uv run --locked --project routinekeel/workflow_studio --group dev ruff format --check --config routinekeel/workflow_studio/pyproject.toml routinekeel/workflow_studio/src routinekeel/workflow_studio/scripts tests/studio tools/studio_release.py
      - name: Run complete non-desktop Studio acceptance
        env:
          STUDIO_GATE_REPORT_DIR: ${{ runner.temp }}/studio-evidence
        run: uv run --locked --project routinekeel/workflow_studio --group dev python -m pytest tests/studio -q -rs -k "not test_real_tk_buttons and not test_tk_analysis and not test_ui_state_multiline" --junitxml="${{ runner.temp }}/studio-evidence/studio-junit.xml"
      - name: Prepare isolated GUI test dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=30 xvfb xauth fonts-wqy-microhei
      - name: Verify guided workbench in an isolated virtual display
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          STUDIO_HEADLESS_UI_TESTS: '1'
          STUDIO_GATE_REPORT_DIR: ${{ runner.temp }}/studio-evidence
        run: |
          xvfb-run -a -s '-screen 0 1440x1000x24' uv run --locked --project routinekeel/workflow_studio --group dev python -m pytest tests/studio/test_ui_guidance.py -q -k headless --junitxml="${{ runner.temp }}/studio-evidence/guided-ui-junit.xml"
      - name: Build opt-in Studio distribution
        run: python tools/release.py --project studio
      - name: Verify packaged launchers and clean installation without desktop
        run: python routinekeel/workflow_studio/scripts/verify_distribution.py dist/release/workflow-studio-0.1.0.zip --require-clean --output "${{ runner.temp }}/studio-evidence/distribution"
      - name: Preserve scoped acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: studio-acceptance-${{ matrix.os }}
          path: ${{ runner.temp }}/studio-evidence/
          if-no-files-found: warn
          retention-days: 7
