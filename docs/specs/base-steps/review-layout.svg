<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 492" role="img" aria-labelledby="title desc">
  <title id="title">Studio 定稿審閱示意</title>
  <desc id="desc">對話依序呈現目前版本、定稿流程與交付摘要。主要動作是確認這一版，檢核依據和步驟細節可另行展開。</desc>
  <rect width="840" height="492" fill="#edf2f7"/>
  <rect x="44" y="30" width="752" height="432" rx="18" fill="#ffffff" stroke="#9fb0c4" stroke-width="2"/>
  <g font-family="Microsoft JhengHei, Noto Sans CJK TC, sans-serif" fill="#192938">
    <text x="75" y="74" font-size="26" font-weight="bold">確認工作流定稿</text>
    <rect x="75" y="95" width="198" height="32" rx="16" fill="#e8eff6"/>
    <text x="92" y="117" font-size="16">目前版本 3 · 待確認</text>
    <rect x="75" y="147" width="690" height="119" rx="12" fill="#f0f4f8"/>
    <text x="94" y="176" font-size="18" font-weight="bold">定稿流程</text>
    <text x="94" y="205" font-size="17">檢核輸入 → 工作步驟 → 檢核輸出 → 整理交付結果</text>
    <text x="94" y="235" font-size="15" fill="#38516a">有文件時先建立索引。圖上也會顯示人工等待與檢核失敗的去向。</text>
    <text x="75" y="301" font-size="17" font-weight="bold">交付摘要</text>
    <text x="75" y="328" font-size="16">依這一版的標準核對成果。通過後提供成果連結與 ZIP。</text>
    <text x="75" y="366" font-size="16" fill="#365879">查看檢核依據與步驟細節</text>
    <rect x="75" y="391" width="168" height="45" rx="8" fill="#174e84"/>
    <text x="159" y="420" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">確認這一版</text>
  </g>
</svg>
